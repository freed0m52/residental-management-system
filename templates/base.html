{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Жилой комплекс{% endblock %}</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Собственный CSS -->
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="bg-light">
    <!-- Навигация -->
    {% include "includes/navigation.html" with site_name="Жилой комплекс" %}

    <!-- Основной контент -->
    <div class="container pb-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Подвал -->
    <footer class="container mt-4 mb-3 text-center text-muted border-top pt-3">
        <p>&copy; <span id="current-year"></span> Управление жилым комплексом</p>
    </footer>

    <!-- Собственный JS -->
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
