{% extends "base.html" %}
{% block title %}Добавить жителя{% endblock %}
{% block content %}
<h2>Новый житель</h2>
<form method="post" class="mt-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'residents:list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
