{% extends "base.html" %}

{% block title %}Жители - Жилой комплекс{% endblock %}

{% block content %}
<h1>Жители</h1>
<p class="text-muted">Всего: {{ residents|length }}</p>

<ul class="list-group">
    {% for r in residents %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="{% url 'residents:detail' r.id %}">{{ r.full_name }}</a>
            <span class="badge bg-secondary">кв. {{ r.apartment_number }}</span>
        </li>
    {% empty %}
        <li class="list-group-item">Список жителей пуст.</li>
    {% endfor %}
</ul>
{% endblock %}
